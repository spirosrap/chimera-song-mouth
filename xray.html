<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIMERA nerve x-ray</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #4fb6f2; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  form { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0, 0, 0, 0.6); padding: 8px 10px; border: 1px solid #133954; border-radius: 6px; }
  select, input, button { accent-color: #4fb6f2; background: #000; color: inherit; border: 1px solid #1f5f8c; border-radius: 4px; font: inherit; }
  body.shot form { display: none; }
  #label { position: fixed; left: 20px; top: 16px; font: 500 26px/1.2 ui-sans-serif, system-ui, sans-serif; color: #a9dcf8; letter-spacing: 0.04em; }
</style>
</head>
<body>
<canvas></canvas>
<div id="label"></div>
<form>
  <label>look <select name="look"><option value="function">by function</option><option value="xray">x-ray by depth</option><option value="signal">signal</option></select></label>
  <label>signal <input name="signal" type="range" min="0" max="1" step="0.01" value="0.3"></label>
  <label>speed <input name="speed" type="range" min="0" max="60" step="1" value="12"></label>
  <label>pose <select name="pose"></select></label>
  <label>mouth <input name="mouth" type="range" min="0" max="1" step="0.01" value="0"></label>
  <button data-view="body">body</button><button data-view="front">front</button><button data-view="back">back</button><button data-view="torso">torso</button><button data-view="head">head</button><button data-view="side">side</button>
</form>
<script>if (new URLSearchParams(location.search).has("shot")) document.body.classList.add("shot");</script>
<script type="module" src="/src/xray/demo.ts"></script>
</body>
</html>
